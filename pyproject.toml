[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toxion"
version = "0.1.1"
description = "Multitask toxicity classification on Tox21: AML baselines, custom MPNN, and fingerprint + graph fusion."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "rdkit>=2024.3.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "xgboost>=2.0"]
gnn = ["torch-geometric>=2.5"]
explain = ["captum>=0.7"]
demo = ["streamlit>=1.35"]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]
dev = ["pytest>=8"]
all = ["toxion[ml,gnn,explain,demo,notebook,dev]"]

[project.scripts]
toxion = "toxion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toxion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
