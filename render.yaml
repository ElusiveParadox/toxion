services:
  - type: web
    name: toxion
    runtime: python
    plan: free
    buildCommand: pip install ".[demo]"
    startCommand: streamlit run app/demo.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
